build:
  maxIssues: 0

complexity:
  LongParameterList:
    active: true
    functionThreshold: 16
    constructorThreshold: 16
  LongMethod:
    active: true
    threshold: 60

naming:
  FunctionNaming:
    ignoreAnnotated:
      - Composable

style:
  MagicNumber:
    active: false
  WildcardImport:
    active: true
